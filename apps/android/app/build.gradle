plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def releaseStorePath = System.getenv('NYAS_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('NYAS_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('NYAS_KEY_ALIAS')
def releaseKeyPassword = System.getenv('NYAS_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.xpresscure.nyas'
    compileSdk 36

    defaultConfig {
        applicationId 'com.xpresscure.nyas'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '1.2.0'

        buildConfigField 'String', 'API_BASE_URL', '"https://nyasa.xpresscure.com/api"'
        buildConfigField 'String', 'WEB_BASE_URL', '"https://nyasa.xpresscure.com"'
        buildConfigField 'String', 'WEB_APP_URL', '"https://nyasa.xpresscure.com/dashboard"'
    }

    buildFeatures {
        buildConfig true
        compose true
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    packaging {
        resources.excludes += '/META-INF/{AL2.0,LGPL2.1}'
    }
}

dependencies {
    def composeBom = platform('androidx.compose:compose-bom:2025.02.00')
    implementation composeBom
    androidTestImplementation composeBom

    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.animation:animation'
    implementation 'androidx.navigation:navigation-compose:2.8.8'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.datastore:datastore-preferences:1.1.3'
    implementation 'androidx.biometric:biometric:1.2.0-alpha05'
    implementation 'androidx.work:work-runtime-ktx:2.10.0'
    implementation 'androidx.health.connect:connect-client:1.1.0-alpha11'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.browser:browser:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.code.gson:gson:2.12.1'
    implementation 'io.coil-kt:coil-compose:2.7.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
