<VirtualHost *:80>
    ServerName product.nyasa.xpresscure.com

    DocumentRoot /var/www/nyasa-product

    ProxyPreserveHost On
    ProxyPass /api/ http://127.0.0.1:4200/api/
    ProxyPassReverse /api/ http://127.0.0.1:4200/api/

    <Directory /var/www/nyasa-product>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.html
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nyasa-product-error.log
    CustomLog ${APACHE_LOG_DIR}/nyasa-product-access.log combined
</VirtualHost>
